<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
}

/* Background */

.hero{
  width:100%;
    min-height:100svh;
    padding:30px 15px;
 background: url("background.png") center center / cover no-repeat;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Dark overlay */

.hero::before{
    background:
    linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.25)
    );
    backdrop-filter:blur(2px);
}

/* Content */

/* Content */

.content{
    position:relative;
    z-index:5;
    color:white;
    text-align:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    width:100%;
    height:100vh;

    animation:fadeIn 2s ease;
}

/* Premium Happy Birthday */

.birthday{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:2px;

    margin-bottom:55px;
}

.birthday span{
    font-family:'Great Vibes', cursive;
    font-size:115px;
    font-weight:normal;
    display:inline-block;

    background:linear-gradient(
        180deg,
        #fffdf8 0%,
        #f8ead0 40%,
        #d9b46b 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
-webkit-text-stroke: 0.6px rgba(60,50,30,.35);
    text-shadow:
        0 2px 8px rgba(255,255,255,.3),
        0 4px 15px rgba(217,180,107,.25);

    letter-spacing:2px;

    animation:luxuryFloat 5s ease-in-out infinite;
}
/* Curved shape */

.birthday span:nth-child(1){transform:translateY(28px);}
.birthday span:nth-child(2){transform:translateY(22px);}
.birthday span:nth-child(3){transform:translateY(16px);}
.birthday span:nth-child(4){transform:translateY(10px);}
.birthday span:nth-child(5){transform:translateY(5px);}

.birthday span:nth-child(7){transform:translateY(5px);}
.birthday span:nth-child(8){transform:translateY(10px);}
.birthday span:nth-child(9){transform:translateY(16px);}
.birthday span:nth-child(10){transform:translateY(22px);}
.birthday span:nth-child(11){transform:translateY(28px);}
.birthday span:nth-child(12){transform:translateY(34px);}
.birthday span:nth-child(13){transform:translateY(40px);}
.birthday span:nth-child(14){transform:translateY(46px);}
.birthday span:nth-child(16){transform:translateY(30px);}

/* Animation delay */

.birthday span:nth-child(1){animation-delay:0s;}
.birthday span:nth-child(2){animation-delay:.1s;}
.birthday span:nth-child(3){animation-delay:.2s;}
.birthday span:nth-child(4){animation-delay:.3s;}
.birthday span:nth-child(5){animation-delay:.4s;}
.birthday span:nth-child(7){animation-delay:.5s;}
.birthday span:nth-child(8){animation-delay:.6s;}
.birthday span:nth-child(9){animation-delay:.7s;}
.birthday span:nth-child(10){animation-delay:.8s;}
.birthday span:nth-child(11){animation-delay:.9s;}
.birthday span:nth-child(12){animation-delay:1s;}
.birthday span:nth-child(13){animation-delay:1.1s;}
.birthday span:nth-child(14){animation-delay:1.2s;}
.birthday span:nth-child(16){animation-delay:1.3s;}

@keyframes wave{
    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-6px) scale(1.03);
    }
}

/* Premium Love Text */

.love-text{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:0;

    margin-bottom:15px;
}

.love-text span{
    display:inline-block;

    font-family:'Great Vibes', cursive;
    font-size:48px;

    background:linear-gradient(
        180deg,
        #ffffff,
        #f5e8c8
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
-webkit-text-stroke: 0.6px rgba(60,50,30,.35);
    text-shadow:
        0 2px 10px rgba(255,255,255,.2),
        0 3px 15px rgba(217,180,107,.15);

    letter-spacing:1px;

    animation:luxuryFloat2 4s ease-in-out infinite;
}
.love-text span:nth-child(odd){
    animation-delay:.15s;
}

.love-text span:nth-child(even){
    animation-delay:.3s;
}

@keyframes luxuryFloat{
    0%,100%{
        transform:translateY(0);
        filter:brightness(1);
    }

    50%{
        transform:translateY(-3px);
        filter:brightness(1.1);
    }
}

@keyframes luxuryFloat2{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-2px);
    }
}
/* Question */

.question{
    margin-top:10px;
    font-size:28px;
    font-weight:300;
    letter-spacing:1px;

    color:#f8f4ec;

    text-shadow:
        0 2px 8px rgba(0,0,0,.35);
}
/* Premium Button */

.btn{
    margin-top:30px;
    display:inline-block;

    padding:18px 60px;
    font-size:22px;
    font-weight:600;

    border-radius:60px;
    text-decoration:none;
    color:white;

    background:linear-gradient(
        135deg,
        #ff4b91,
        #ff7eb3
    );

    box-shadow:
        0 0 25px rgba(255,105,180,.5),
        0 10px 40px rgba(255,80,140,.5);

    transition:.4s;
}

.btn:hover{
    transform:translateY(-5px) scale(1.05);

    box-shadow:
        0 0 35px rgba(255,105,180,.8),
        0 15px 60px rgba(255,80,140,.8);
}

.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:2;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:
    0 0 8px white,
    0 0 15px white,
    0 0 25px white;
    animation:twinkle linear infinite;
}

@keyframes twinkle{

0%,100%{
opacity:.2;
transform:scale(.5);
}

50%{
opacity:1;
transform:scale(2);
}

}

@keyframes glow{

from{
text-shadow:0 0 15px white;
}

to{
text-shadow:
0 0 25px #fff,
0 0 45px pink,
0 0 60px hotpink;
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}
/* PHONE */

@media(max-width:768px){

    .hero{
        min-height:100svh;
        padding:20px 10px;
    }

    .content{
        min-height:100svh;
        width:100%;
        padding:20px 5px;
    }

    .birthday{
        margin-bottom:30px;
        gap:0;
    }

    .birthday span{
        font-size:58px !important;
    }

    /* Softer curve for phones */
    .birthday span:nth-child(1){transform:translateY(12px);}
    .birthday span:nth-child(2){transform:translateY(9px);}
    .birthday span:nth-child(3){transform:translateY(6px);}
    .birthday span:nth-child(4){transform:translateY(3px);}
    .birthday span:nth-child(5){transform:translateY(0);}

    .birthday span:nth-child(7){transform:translateY(0);}
    .birthday span:nth-child(8){transform:translateY(3px);}
    .birthday span:nth-child(9){transform:translateY(6px);}
    .birthday span:nth-child(10){transform:translateY(9px);}
    .birthday span:nth-child(11){transform:translateY(12px);}
    .birthday span:nth-child(12){transform:translateY(15px);}
    .birthday span:nth-child(13){transform:translateY(18px);}
    .birthday span:nth-child(14){transform:translateY(20px);}
    .birthday span:nth-child(16){transform:translateY(12px);}

    .love-text{
        margin-bottom:20px;
    }

    .love-text span{
        font-size:26px !important;
    }

    .question{
        margin-top:10px;
        font-size:18px !important;
        line-height:1.5;
        padding:0 15px;
    }

    .btn{
        margin-top:25px;
        padding:15px 40px;
        font-size:18px;
    }
}


/* SMALL PHONES */

@media(max-width:480px){

    .birthday span{
        font-size:48px !important;
    }

    /* Extra soft curve */
    .birthday span:nth-child(1){transform:translateY(8px);}
    .birthday span:nth-child(2){transform:translateY(6px);}
    .birthday span:nth-child(3){transform:translateY(4px);}
    .birthday span:nth-child(4){transform:translateY(2px);}
    .birthday span:nth-child(5){transform:translateY(0);}

    .birthday span:nth-child(7){transform:translateY(0);}
    .birthday span:nth-child(8){transform:translateY(2px);}
    .birthday span:nth-child(9){transform:translateY(4px);}
    .birthday span:nth-child(10){transform:translateY(6px);}
    .birthday span:nth-child(11){transform:translateY(8px);}
    .birthday span:nth-child(12){transform:translateY(10px);}
    .birthday span:nth-child(13){transform:translateY(12px);}
    .birthday span:nth-child(14){transform:translateY(14px);}
    .birthday span:nth-child(16){transform:translateY(8px);}

    .love-text span{
        font-size:22px !important;
    }

    .question{
        font-size:16px !important;
    }

    .btn{
        padding:14px 35px;
        font-size:16px;
    }
}
</style>

</head>
<body>

<div class="hero">

<div class="stars" id="stars"></div>

<div class="content">

</div>

</div>

<script>

const stars=document.getElementById("stars");

for(let i=0;i<180;i++){

let star=document.createElement("div");
star.classList.add("star");

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

let size=Math.random()*4+1;

star.style.width=size+"px";
star.style.height=size+"px";

star.style.animationDuration=(Math.random()*3+2)+"s";
star.style.animationDelay=Math.random()*5+"s";

stars.appendChild(star);

}

</script>

</body>
</html>
